name: Feature request
description: Propuesta de mejora pequena. Para cambios arquitectonicos, abra una RFC.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Si su propuesta implica un cambio arquitectonico, un nuevo crate,
        modificaciones al DSL o cambios en los objetivos de rendimiento,
        abra una RFC en `docs/rfc/` en lugar de un issue.
  - type: textarea
    id: problem
    attributes:
      label: Problema que la propuesta resuelve
      description: Que dolor concreto tiene un usuario hoy.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Descripcion de la mejora; no incluya implementacion detallada.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Fase objetivo
      options:
        - Fase 0
        - Fase 1
        - Fase 2
        - Fase 3
        - Fase 4
        - Fase 5
        - Fase 6
        - Fase 7
        - Fase 8
        - Fase 9
        - Fase 10
        - Post-1.0
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: checks
    attributes:
      label: Verificaciones
      options:
        - label: La propuesta respeta el alcance declarado en docs/master/.
          required: true
        - label: He revisado docs/roadmap/ y la propuesta encaja en una fase.
          required: true
