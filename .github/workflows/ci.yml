name: ci

# Construye el workspace en las cuatro plataformas objetivo de Fase 0:
# Linux x86-64, Linux ARM64, macOS ARM64 y Windows x64. Cumple criterio
# de salida 0.3 sobre CI en workspace vacio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: cargo build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}

  # The native MTA and the managed API live behind the opt-in `mta` / `api`
  # features, off by default, so the matrix build above never exercises them.
  # This job builds, tests and lints ag-mail with both on (RFC-0009 section 4.8).
  mail-mta:
    name: ag-mail mta + api features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mta-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mta-

      - name: cargo build (mta + api)
        run: cargo build -p ag-mail --features mta,api,minijinja

      - name: cargo test (mta + api)
        run: cargo test -p ag-mail --features mta,api,minijinja

      - name: cargo clippy (mta + api)
        run: cargo clippy -p ag-mail --features mta,api,minijinja --all-targets -- -D warnings
