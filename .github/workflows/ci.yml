name: ci

# Construye el workspace en las cuatro plataformas objetivo de Fase 0:
# Linux x86-64, Linux ARM64, macOS ARM64 y Windows x64. Cumple criterio
# de salida 0.3 sobre CI en workspace vacio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: cargo build
        run: cargo build --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: cargo test
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}

  # The native MTA and the managed API live behind the opt-in `mta` / `api`
  # features, off by default, so the matrix build above never exercises them.
  # This job builds, tests and lints ag-mail with both on (RFC-0009 section 4.8).
  mail-mta:
    name: ag-mail mta + api features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mta-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mta-

      - name: cargo build (mta + api)
        run: cargo build --locked -p ag-mail --features mta,api,minijinja

      - name: cargo test (mta + api)
        run: cargo test --locked -p ag-mail --features mta,api,minijinja

      - name: cargo clippy (mta + api)
        run: cargo clippy --locked -p ag-mail --features mta,api,minijinja --all-targets -- -D warnings

  # The opt-in `otlp` feature (ADR-0019, RFC-0028) is off by default, so the
  # matrix build above never exercises it. This job checks, tests and lints
  # ag-observe with the feature on. It needs no protoc: opentelemetry-proto
  # 0.33.x ships pre-generated protobuf sources and has no build script.
  # It also needs no external collector: the feature tests only build the
  # HTTP exporter against a synthetic endpoint and never contact it.
  # The default-feature matrix is unchanged.
  otlp:
    name: ag-observe otlp feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-otlp-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-otlp-

      - name: cargo check (otlp)
        run: cargo check --locked -p ag-observe --features otlp --all-targets

      - name: cargo test (otlp)
        run: cargo test --locked -p ag-observe --features otlp

      - name: cargo clippy (otlp)
        run: cargo clippy --locked -p ag-observe --features otlp --all-targets -- -D warnings
