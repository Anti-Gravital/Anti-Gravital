name: docs

# Valida la documentacion del workspace: cargo doc, integridad de los
# documentos maestros y ausencia de evidencia de herramientas IA en el
# repositorio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo doc --locked --workspace --no-deps

  masters-integrity:
    name: masters integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify SHA-256 of master documents
        run: |
          set -euo pipefail
          # Los hashes deben mantenerse en sync con docs/master/VERSION.md.
          # Cambios a los maestros requieren ADR aprobado y actualizacion
          # coordinada de VERSION.md y este workflow en el mismo PR.
          # Estado actual: retirada de ag-ui del roster (issue #182, RFC-0019),
          # 2026-11-21; Hoja-de-Ruta con estado de Fases 4.7/4.8 sincronizado
          # con la ola 4 y el hito alpha, 2026-11-22. Arquitectura y
          # Hoja-de-Ruta bilingues (EN-primero).
          # Blueprint v4.1.md es la fuente markdown versionable. Blueprint PDF
          # queda en v4.0 como deuda explicita pendiente de re-export a v4.1;
          # los maestros markdown gobiernan (VERSION.md politica #4).
          expected_blueprint_pdf="59a1df26bd24e96067c58c142709e3cb55fc33efbb1c8f3739d9473598dfb660"
          expected_blueprint_md="36ea6d46ffe61694dec9be0eaaa1b4a82affebbb67654e2ad612aa5afe494a82"
          # Single source of truth: docs/master/VERSION.md hash table.
          # Keep these literals in sync with that table (RFC-0038 updated Arquitectura to ed89854f on 2026-11-22).
          expected_arch="ed89854fffd1ce7dc6f25d8955a60ee54fb871396ff726ad27a2db06a46347fb"
          expected_road="210a8b8720659393fa0b5439586e7f7e56ea534eb813a36392adefe26ec062af"
          got_blueprint_pdf="$(sha256sum docs/master/ANTI-GRAVITAL-Blueprint-v4.0.pdf | awk '{print $1}')"
          got_blueprint_md="$(sha256sum docs/master/ANTI-GRAVITAL-Blueprint-v4.1.md | awk '{print $1}')"
          got_arch="$(sha256sum docs/master/ANTI-GRAVITAL-Arquitectura-Tecnica.md | awk '{print $1}')"
          got_road="$(sha256sum docs/master/ANTI-GRAVITAL-Hoja-de-Ruta.md | awk '{print $1}')"
          test "$got_blueprint_pdf" = "$expected_blueprint_pdf"
          test "$got_blueprint_md" = "$expected_blueprint_md"
          test "$got_arch" = "$expected_arch"
          test "$got_road" = "$expected_road"
          echo "Maestros validos."

  prohibited-content:
    name: prohibited content scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject AI tool evidence outside allowed files
        run: |
          set -euo pipefail
          # Solo CLAUDE.md puede mencionar el nombre, porque la regla 2 del
          # propio CLAUDE.md fija ese nombre de archivo.
          if grep -RIE "Co-Authored-By: (Claude|GPT|Copilot)" \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrada atribucion IA en commits o archivos."
            exit 1
          fi
          if grep -RIE "claude\\.ai/code/session_" \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrada URL de sesion IA en el repositorio."
            exit 1
          fi
          echo "Sin evidencia prohibida de herramientas IA."

      - name: Reject descriptor names with prohibited AI branch prefixes
        run: |
          set -euo pipefail
          # Los descriptores de docs/pr-drafts/ se nombran por la rama
          # aplanada, asi que no pueden llevar un prefijo de rama de
          # herramienta IA (claude-, gpt-, ai-, copilot-, chatgpt-, gemini-,
          # bard-). El check se acota a esta carpeta para no marcar nombres
          # legitimos que casualmente empiecen por esos tokens en otras rutas
          # (p. ej. examples/ai-backend), que no derivan de un nombre de rama.
          if git ls-files docs/pr-drafts \
               | grep -InE "/(claude|gpt|ai|copilot|chatgpt|gemini|bard)-" ; then
            echo "Descriptor con prefijo de rama IA prohibido en docs/pr-drafts/."
            exit 1
          fi
          echo "Sin descriptores con prefijo de rama IA prohibido."

      - name: Reject emojis in tracked files
        run: |
          set -euo pipefail
          if grep -RIPn "[\\x{1F300}-\\x{1FAFF}]|[\\x{2600}-\\x{27BF}]|[\\x{1F000}-\\x{1F2FF}]" \
                --include='*.md' --include='*.rs' --include='*.toml' \
                --include='*.yml' --include='*.yaml' --include='*.sh' \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrados emojis en archivos del proyecto."
            exit 1
          fi
          echo "Sin emojis."

      - name: Reject retired third-party brand names (ADR-0011)
        run: |
          set -euo pipefail
          # Las marcas de correo retiradas no deben reaparecer. Se excluyen los
          # archivos que DEFINEN la politica (deben nombrar las marcas) y el
          # propio workflow. Cloudflare/S3 (adaptadores legitimos) y los
          # proveedores de buzon destino (Gmail/Yahoo/Outlook) no se escanean.
          if grep -RInE "\\b(Resend|Postmark|Svix)\\b|\\bSES\\b|(Resend|Ses|Postmark)Sender" \
                --include='*.md' --include='*.rs' --include='*.toml' \
                --include='*.yml' --include='*.yaml' --include='*.sh' \
                --exclude='0011-politica-marcas-comerciales.md' \
                --exclude='RFC-0010-ag-mail-superficie-sin-marcas.md' \
                --exclude='docs.yml' \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontradas marcas comerciales de terceros retiradas (ver ADR-0011)."
            exit 1
          fi
          echo "Sin marcas comerciales de terceros prohibidas."

  descriptor-closing:
    name: descriptor closing-keywords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Require an issue-closing section in every PR descriptor
        run: |
          set -euo pipefail
          # GitHub solo auto-cierra issues al fusionar si el cuerpo de la PR
          # (que es el descriptor via pr-autofill) usa una palabra clave de
          # cierre. Todo descriptor debe declarar explicitamente sus cierres:
          # `Closes #NNN` / `Fixes #NNN` / `Resolves #NNN`, o `Closes: none`.
          missing=0
          shopt -s nullglob
          for f in docs/pr-drafts/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            if ! grep -qiE "^[[:space:]>*-]*(closes|fixes|resolves)[[:space:]:]+(#[0-9]+|none|ninguno)\b" "$f"; then
              echo "Descriptor sin seccion de cierre de issues (Closes #NNN / Closes: none): $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Cada descriptor debe declarar sus cierres con palabra clave; ver docs/pr-drafts/README.md."
            exit 1
          fi
          echo "Todos los descriptores declaran cierre de issues."
