name: docs

# Valida la documentacion del workspace: cargo doc, integridad de los
# documentos maestros y ausencia de evidencia de herramientas IA en el
# repositorio.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps

  masters-integrity:
    name: masters integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256 of master documents
        run: |
          set -euo pipefail
          # Los hashes deben mantenerse en sync con docs/master/VERSION.md.
          # Cambios a los maestros requieren ADR aprobado y actualizacion
          # coordinada de VERSION.md y este workflow en el mismo PR.
          # Estado actual: cierre documental Fase 4.0-4.5 (ADR-0008), 2026-05-26.
          # Arquitectura y Hoja-de-Ruta ahora bilingues (EN-primero). Se anade
          # el Blueprint v4.1.md como fuente markdown versionable. Blueprint PDF
          # queda en v4.0 como deuda explicita pendiente de re-export a v4.1;
          # los maestros markdown gobiernan (VERSION.md politica #4).
          expected_blueprint_pdf="59a1df26bd24e96067c58c142709e3cb55fc33efbb1c8f3739d9473598dfb660"
          expected_blueprint_md="be7c175f133580a007864d5740ebebe8da762468c5b564650a6f0bd33f355cbb"
          expected_arch="e055e7f4ea9f1fbbf0cf6bd05208afcefb31c7f2c7f849012d89da67885726f5"
          expected_road="32b36442ec47f304a1bdf43ef1fee2b02df6886307d93a101d20d37f96157ba0"
          got_blueprint_pdf="$(sha256sum docs/master/ANTI-GRAVITAL-Blueprint-v4.0.pdf | awk '{print $1}')"
          got_blueprint_md="$(sha256sum docs/master/ANTI-GRAVITAL-Blueprint-v4.1.md | awk '{print $1}')"
          got_arch="$(sha256sum docs/master/ANTI-GRAVITAL-Arquitectura-Tecnica.md | awk '{print $1}')"
          got_road="$(sha256sum docs/master/ANTI-GRAVITAL-Hoja-de-Ruta.md | awk '{print $1}')"
          test "$got_blueprint_pdf" = "$expected_blueprint_pdf"
          test "$got_blueprint_md" = "$expected_blueprint_md"
          test "$got_arch" = "$expected_arch"
          test "$got_road" = "$expected_road"
          echo "Maestros validos."

  prohibited-content:
    name: prohibited content scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject AI tool evidence outside allowed files
        run: |
          set -euo pipefail
          # Solo CLAUDE.md puede mencionar el nombre, porque la regla 2 del
          # propio CLAUDE.md fija ese nombre de archivo.
          if grep -RIE "Co-Authored-By: (Claude|GPT|Copilot)" \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrada atribucion IA en commits o archivos."
            exit 1
          fi
          if grep -RIE "claude\\.ai/code/session_" \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrada URL de sesion IA en el repositorio."
            exit 1
          fi
          echo "Sin evidencia prohibida de herramientas IA."

      - name: Reject emojis in tracked files
        run: |
          set -euo pipefail
          if grep -RIPn "[\\x{1F300}-\\x{1FAFF}]|[\\x{2600}-\\x{27BF}]|[\\x{1F000}-\\x{1F2FF}]" \
                --include='*.md' --include='*.rs' --include='*.toml' \
                --include='*.yml' --include='*.yaml' --include='*.sh' \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontrados emojis en archivos del proyecto."
            exit 1
          fi
          echo "Sin emojis."

      - name: Reject retired third-party brand names (ADR-0011)
        run: |
          set -euo pipefail
          # Las marcas de correo retiradas no deben reaparecer. Se excluyen los
          # archivos que DEFINEN la politica (deben nombrar las marcas) y el
          # propio workflow. Cloudflare/S3 (adaptadores legitimos) y los
          # proveedores de buzon destino (Gmail/Yahoo/Outlook) no se escanean.
          if grep -RInE "\\b(Resend|Postmark|Svix)\\b|\\bSES\\b|(Resend|Ses|Postmark)Sender" \
                --include='*.md' --include='*.rs' --include='*.toml' \
                --include='*.yml' --include='*.yaml' --include='*.sh' \
                --exclude='0011-politica-marcas-comerciales.md' \
                --exclude='RFC-0010-ag-mail-superficie-sin-marcas.md' \
                --exclude='docs.yml' \
                --exclude-dir=target --exclude-dir=.git . ; then
            echo "Encontradas marcas comerciales de terceros retiradas (ver ADR-0011)."
            exit 1
          fi
          echo "Sin marcas comerciales de terceros prohibidas."
