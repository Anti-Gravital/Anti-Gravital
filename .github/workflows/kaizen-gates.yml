name: kaizen-gates
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

# Serializa las ejecuciones del workflow para que el job `metrics` (que hace
# commit y push de docs/kaizen/data/metrics.jsonl) no compita con otro push a
# main: cancel-in-progress=false encola, no descarta, para no perder metricas.
concurrency:
  group: kaizen-metrics
  cancel-in-progress: false

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Selftests del framework
        run: bash tests/run.sh
      - name: Validacion de la instalacion swarm
        run: scripts/kaizen-swarm check

  descriptor-closing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar descriptores
        run: scripts/kaizen check --only descriptors

  content-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar politicas de contenido
        run: scripts/kaizen check --only policy

  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar linea base de calidad
        run: scripts/kaizen check --only ratchet

  metrics:
    if: github.event_name == 'push'
    needs: [framework, content-policy, ratchet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar metricas
        run: |
          scripts/kaizen metrics
          git config user.name "kaizen-bot"
          git config user.email "kaizen-bot@users.noreply.github.com"
          git add docs/kaizen/data/metrics.jsonl
          git diff --cached --quiet || git commit -m "Registrar metricas de calidad"
          # La concurrencia de arriba evita la carrera habitual; el reintento
          # cubre pushes externos que avancen origin/main entre checkout y push.
          # Falla en abierto (S-10): ningun rechazo ni error de rebase se oculta.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "metrics: push rechazado (intento $attempt); rebase y reintento" >&2
            if ! git pull --rebase origin main; then
              echo "metrics: rebase fallo; error real, no se silencia" >&2
              exit 1
            fi
          done
          echo "metrics: no se pudo publicar tras 5 intentos" >&2
          exit 1
