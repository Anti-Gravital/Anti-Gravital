name: kaizen-loop
# Requiere decision humana: variable KAIZEN_LOOP_ENABLED=1 y secretos KAIZEN_TOKEN + clave del modelo.
# Sin ellos no hay ejecuciones programadas ni ruido de CI (ADR-0001).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "dev | ops | sweep | research | product (vacio = rotar)"
        required: false

concurrency:
  group: kaizen-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  variables: write

jobs:
  iterate:
    if: vars.KAIZEN_LOOP_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.KAIZEN_TOKEN }}
      - name: Configurar credenciales de git
        env:
          GH_TOKEN: ${{ secrets.KAIZEN_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "kaizen-bot"
          git config --global user.email "kaizen-bot@users.noreply.github.com"
      - name: Telemetria a insights (solo lectura, opcional)
        if: ${{ hashFiles('scripts/kaizen-insights.py') != '' }}
        env:
          GH_TOKEN: ${{ secrets.KAIZEN_TOKEN }}
        run: python3 scripts/kaizen-insights.py --create-issues || :
      - name: Iteracion del loop (nivel 3, sin PAUSA)
        env:
          GH_TOKEN: ${{ secrets.KAIZEN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: scripts/kaizen-loop once "${{ github.event.inputs.loop }}"
