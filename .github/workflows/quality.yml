name: quality

# Calidad estatica del workspace: formato, lints, auditoria de
# seguridad y politica de dependencias.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  installers:
    name: installer checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify checksums and MSRV parity
        if: runner.os == 'Linux'
        run: bash tools/check-installers.sh
      - name: Verify PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify PowerShell checksums and MSRV behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content checksums/installers.sha256 | ForEach-Object {
            $hash, $path = $_ -split '\s+', 2
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) {
              throw "Checksum mismatch: $path"
            }
          }
          $fakeBin = Join-Path $env:RUNNER_TEMP "ag-installer-fixtures"
          New-Item -ItemType Directory -Force $fakeBin | Out-Null
          Set-Content (Join-Path $fakeBin "cargo.cmd") '@echo unexpected cargo invocation & exit /b 99'
          Set-Content (Join-Path $fakeBin "rustc.cmd") '@echo rustc 1.78.0 (test fixture)'
          $env:PATH = "$fakeBin;$env:PATH"
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 1) {
            throw "install.ps1 accepted Rust below the workspace MSRV"
          }
          Set-Content (Join-Path $fakeBin "cargo.cmd") '@echo cargo %* & exit /b 0'
          Set-Content (Join-Path $fakeBin "rustc.cmd") '@echo rustc 1.95.0 (test fixture)'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 rejected the workspace MSRV"
          }

  msrv:
    name: cargo check (MSRV 1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-1.95.0-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check


  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: run cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          arguments: --all-features

  fuzz-smoke:
    name: cargo fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
      - name: fuzz fuzz_lexer 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_lexer -- -max_total_time=60
      - name: fuzz fuzz_parser 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_parser -- -max_total_time=60
      - name: fuzz fuzz_compile 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_compile -- -max_total_time=60
      - name: fuzz fuzz_workers_payload 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_workers_payload -- -max_total_time=60
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  coverage:
    name: cargo tarpaulin (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.toml') }}
      - name: install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      # The native MTA (`mta`) and managed API (`api`) live behind opt-in
      # features not enabled in this default-feature run, and the network/PG
      # paths need infrastructure; their tests run in the `ci / ag-mail mta +
      # api features` job instead. Excluded here like `smtp.rs` (network).
      # ag-workers' durable PostgreSQL backend is the same case: feature
      # unification under --workspace pulls it in via the workers-postgres
      # example, but its tests are #[ignore] and require DATABASE_URL.
      #
      # The gate measures library code only: examples, benchmarks and fuzz
      # targets are executable documentation/harnesses with no unit tests by
      # design, so counting them only distorts the denominator (each new
      # example lowered workspace coverage regardless of crate test quality).
      - name: run coverage with 80% gate
        run: >
          cargo tarpaulin --workspace --timeout 300 --fail-under 80
          --out Xml --exclude-files "crates/*/tests/*" "tests/*"
          "examples/*" "benchmarks/*" "fuzz/*"
          "crates/*/benches/*" "crates/*/examples/*"
          "crates/ag-cli/src/main.rs"
          "crates/ag-lsp/src/main.rs"
          "crates/ag-realtime/src/ws.rs"
          "crates/ag-realtime/src/sse.rs"
          "crates/ag-mail/src/sender/smtp.rs"
          "crates/ag-mail/src/sender/mta/*"
          "crates/ag-mail/src/api/*"
          "crates/ag-mail/src/template/jinja.rs"
          "crates/ag-workers/src/queue/postgres.rs"
