name: quality

# Calidad estatica del workspace: formato, lints, auditoria de
# seguridad y politica de dependencias.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  installers:
    name: installer checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums and MSRV parity
        if: runner.os == 'Linux'
        run: bash tools/check-installers.sh
      - name: Verify PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify PowerShell checksums and MSRV behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content checksums/installers.sha256 | ForEach-Object {
            $hash, $path = $_ -split '\s+', 2
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) {
              throw "Checksum mismatch: $path"
            }
          }
          $fakeBin = Join-Path $env:RUNNER_TEMP "ag-installer-fixtures"
          New-Item -ItemType Directory -Force $fakeBin | Out-Null
          Set-Content (Join-Path $fakeBin "cargo.cmd") '@echo unexpected cargo invocation & exit /b 99'
          Set-Content (Join-Path $fakeBin "rustc.cmd") '@echo rustc 1.78.0 (test fixture)'
          $env:PATH = "$fakeBin;$env:PATH"
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 1) {
            throw "install.ps1 accepted Rust below the workspace MSRV"
          }
          Set-Content (Join-Path $fakeBin "cargo.cmd") '@echo cargo %* & exit /b 0'
          Set-Content (Join-Path $fakeBin "rustc.cmd") '@echo rustc 1.79.0 (test fixture)'
          pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 rejected the workspace MSRV"
          }

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check


  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: run cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  fuzz-smoke:
    name: cargo fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
      - name: fuzz fuzz_lexer 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_lexer -- -max_total_time=60
      - name: fuzz fuzz_parser 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_parser -- -max_total_time=60
      - name: fuzz fuzz_compile 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_compile -- -max_total_time=60
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  coverage:
    name: cargo tarpaulin (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.toml') }}
      - name: install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      # The native MTA (`mta`) and managed API (`api`) live behind opt-in
      # features not enabled in this default-feature run, and the network/PG
      # paths need infrastructure; their tests run in the `ci / ag-mail mta +
      # api features` job instead. Excluded here like `smtp.rs` (network).
      - name: run coverage with 80% gate
        run: >
          cargo tarpaulin --workspace --timeout 300 --fail-under 80
          --out Xml --exclude-files "crates/*/tests/*" "tests/*"
          "crates/ag-cli/src/main.rs"
          "crates/ag-lsp/src/main.rs"
          "crates/ag-realtime/src/ws.rs"
          "crates/ag-realtime/src/sse.rs"
          "crates/ag-mail/src/sender/smtp.rs"
          "crates/ag-mail/src/sender/mta/*"
          "crates/ag-mail/src/api/*"
          "crates/ag-mail/src/template/jinja.rs"
