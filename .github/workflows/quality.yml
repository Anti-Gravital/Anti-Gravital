name: quality

# Calidad estatica del workspace: formato, lints, auditoria de
# seguridad y politica de dependencias.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check


  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: run cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  fuzz-smoke:
    name: cargo fuzz smoke (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
      - name: fuzz fuzz_lexer 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_lexer -- -max_total_time=60
      - name: fuzz fuzz_parser 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_parser -- -max_total_time=60
      - name: fuzz fuzz_compile 60s
        working-directory: fuzz
        run: cargo fuzz run fuzz_compile -- -max_total_time=60
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  coverage:
    name: cargo tarpaulin (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.toml') }}
      - name: install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      # The native MTA (`mta`) and managed API (`api`) live behind opt-in
      # features not enabled in this default-feature run, and the network/PG
      # paths need infrastructure; their tests run in the `ci / ag-mail mta +
      # api features` job instead. Excluded here like `smtp.rs` (network).
      - name: run coverage with 80% gate
        run: >
          cargo tarpaulin --workspace --timeout 300 --fail-under 80
          --out Xml --exclude-files "crates/*/tests/*" "tests/*"
          "crates/ag-cli/src/main.rs"
          "crates/ag-lsp/src/main.rs"
          "crates/ag-realtime/src/ws.rs"
          "crates/ag-realtime/src/sse.rs"
          "crates/ag-mail/src/sender/smtp.rs"
          "crates/ag-mail/src/sender/mta/*"
          "crates/ag-mail/src/api/*"
          "crates/ag-mail/src/template/jinja.rs"
