[workspace]
resolver = "2"
members = [
    "crates/ag-core",
    "crates/ag-dsl",
    "crates/ag-cli",
    "crates/ag-auth",
    "crates/ag-data",
    "crates/ag-realtime",
    "crates/ag-cache",
    "crates/ag-storage",
    "crates/ag-observe",
    "crates/ag-ui",
    "crates/ag-cloud",
    "crates/ag-ai",
    "crates/ag-mobile",
    "crates/ag-migrate",
    "crates/ag-wasm-host",
    "crates/ag-lsp",
    "examples/todo-api",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
authors = ["Gravital Labs - Nereira Technology and Business Solutions"]
repository = "https://github.com/anti-gravital/anti-gravital"
homepage = "https://github.com/anti-gravital/anti-gravital"
documentation = "https://github.com/anti-gravital/anti-gravital/tree/main/docs"
readme = "README.md"
keywords = ["framework", "rust", "backend", "anti-gravital"]
categories = ["web-programming", "asynchronous"]
publish = false

# Dependencias compartidas del workspace.
# Cada nueva dependencia exige RFC; el set inicial corresponde a RFC-0002
# (diseno del Shield MVP). Las adiciones de Fase 2 (sqlx, clap) estan
# justificadas en la Hoja de Ruta §2.2. Las adiciones de Fase 3 (logos,
# chumsky) estan justificadas en RFC-0003 (compilador ag-dsl).
# Los crates internos las referencian con `dep = { workspace = true }`.
[workspace.dependencies]
ag-core = { path = "crates/ag-core", version = "0.0.0" }
ag-data = { path = "crates/ag-data", version = "0.0.0" }
ag-dsl = { path = "crates/ag-dsl", version = "0.0.0" }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio", "json", "matched-path", "query", "ws"] }
async-nats = "0.48"
rmp-serde  = "1"
futures-util = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
chumsky = "0.9"
logos = "0.14"
governor = "0.7"
http = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
http-body-util = "0.1"
hyper = { version = "1.4", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "http2"] }
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "cors"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry    = "0.28"
opentelemetry            = { version = "0.27", features = ["trace"] }
opentelemetry_sdk        = { version = "0.27", features = ["rt-tokio"] }
metrics                  = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
console-subscriber       = "0.4"
# TECH-DEBT: opentelemetry-otlp (grpc-tonic) requiere protoc en compilacion
# (Windows CI). webauthn-rs (MPL-2.0 bloqueada) y oauth2 (reqwest 0.11 con
# rustls-pemfile unmaintained) se reintegran en la segunda iteracion de ag-auth.
# Eliminacion esperada: segunda iteracion Fase 4.
blake3                   = "1"
base64ct                 = { version = "1", features = ["alloc"] }
getrandom                = "0.2"

# Dev-dependencies compartidas.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-test = "0.4"
moka = { version = "0.12", features = ["future"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

[workspace.lints.rust]
# Cada bloque `unsafe` exige justificacion via RFC; por defecto se rechaza.
# Para sobreescribir en un crate concreto, anada un `#[allow(unsafe_code)]`
# con un comentario `// TECH-DEBT:` o un enlace a la RFC autorizadora.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
