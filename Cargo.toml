[workspace]
resolver = "2"
members = [
    "crates/ag-core",
    "crates/ag-dsl",
    "crates/ag-cli",
    "crates/ag-auth",
    "crates/ag-data",
    "crates/ag-realtime",
    "crates/ag-cache",
    "crates/ag-storage",
    "crates/ag-observe",
    "crates/ag-ui",
    "crates/ag-cloud",
    "crates/ag-ai",
    "crates/ag-mobile",
    "crates/ag-migrate",
    "crates/ag-wasm-host",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
authors = ["Gravital Labs - Nereira Technology and Business Solutions"]
repository = "https://github.com/anti-gravital/anti-gravital"
homepage = "https://github.com/anti-gravital/anti-gravital"
documentation = "https://github.com/anti-gravital/anti-gravital/tree/main/docs"
readme = "README.md"
keywords = ["framework", "rust", "backend", "anti-gravital"]
categories = ["web-programming", "asynchronous"]
publish = false

# Dependencias compartidas del workspace.
# Cada nueva dependencia exige RFC; el set inicial corresponde a RFC-0002
# (diseno del Shield MVP). Los crates internos las referencian con
# `dep = { workspace = true }`.
[workspace.dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio", "json", "matched-path"] }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "http2"] }
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Dev-dependencies compartidas.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-test = "0.4"

[workspace.lints.rust]
# Cada bloque `unsafe` exige justificacion via RFC; por defecto se rechaza.
# Para sobreescribir en un crate concreto, anada un `#[allow(unsafe_code)]`
# con un comentario `// TECH-DEBT:` o un enlace a la RFC autorizadora.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
