[package]
name = "ag-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Autenticacion y autorizacion: WebAuthn, JWT Ed25519, OAuth2, RBAC"
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
persistent = ["dep:ag-data"]
mail = ["dep:ag-mail"]

[dependencies]
ag-data = { workspace = true, optional = true }
ag-mail = { path = "../ag-mail", version = "0.0.0", optional = true, features = ["smtp"] }
blake3 = { workspace = true }
base64ct = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# WebAuthn: passkey-types (Apache-2.0) para tipos FIDO2/COSE.
# OAuth2: oauth2 v5 sin feature reqwest; intercambio HTTP via reqwest 0.12.
passkey-types = { workspace = true }
oauth2        = { workspace = true }
ciborium      = { workspace = true }
sha2          = { workspace = true }
p256          = { workspace = true }
hmac          = { workspace = true }
reqwest       = { workspace = true }
ed25519-dalek = { workspace = true }
url           = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
ag-mail = { path = "../ag-mail", version = "0.0.0", features = ["test-utils"] }
tokio = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
rand_core = { workspace = true }
