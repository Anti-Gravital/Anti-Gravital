[package]
name = "ag-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Binario unificado ag: new, generate, dev, build, deploy"
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "ag"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Operational `ag workers` commands that talk to a live durable backend
# (enqueue/dlq/inspect/doctor). Pulls ag-workers (postgres) + sqlx. RFC-0012 §27.
# On by default; a minimal CLI build can opt out with --no-default-features.
default = ["workers-runtime", "tui"]
# Interactive full-screen terminal interface (RFC-0018). On by default; without
# it every command stays flag-only and never prompts.
tui = ["dep:ratatui"]
workers-runtime = ["dep:ag-workers", "dep:sqlx"]

[dependencies]
ag-dsl = { workspace = true }
ag-domains = { path = "../ag-domains", version = "0.0.0", features = ["propagation", "cloudflare"] }
ag-mail = { path = "../ag-mail", version = "0.0.0", features = ["smtp"] }
ag-workers = { path = "../ag-workers", version = "0.0.0", optional = true, features = ["postgres"] }
clap = { workspace = true }
# Terminal UI (layout, widgets, test backend) with its crossterm backend, which
# is re-exported and used for raw mode and key events. Justified by RFC-0018.
ratatui = { version = "0.30", optional = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
