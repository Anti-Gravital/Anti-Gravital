[package]
name = "ag-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Runtime HTTP, router y middleware del nucleo Anti-Gravital"
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

# Features de Fase 1.
# Cada feature aisla una capa Shield. Vease RFC-0002 seccion 4.3.
# Las capas TLS, JWT y rate-limit llegan en PRs posteriores y por ahora
# las features simplemente reservan los nombres y compilan vacias.
[features]
default = ["validation", "cors", "csrf", "logging", "rate-limit"]
tls = []
auth-jwt = []
rate-limit = ["dep:governor"]
validation = []
cors = []
csrf = []
logging = []

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
governor = { workspace = true, optional = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
pin-project-lite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-test = { workspace = true }
