[package]
name = "ag-domains"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Gestion de dominios y TLS para Anti-Gravital: trait DnsProvider con adapters, ACME (Let's Encrypt), SPF/DKIM/DMARC, verificacion de propagacion"
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[features]
# Cliente ACME y verificacion de propagacion activos por defecto.
default = ["acme", "propagation"]
acme = ["dep:instant-acme", "dep:rcgen", "dep:x509-parser", "dep:chrono"]
propagation = ["dep:hickory-resolver"]
# Adapters de proveedor DNS - opcionales (feature de Cargo).
cloudflare = ["dep:reqwest"]
# REST API surface for the control plane (RFC-0009 phase C), backed by the
# native attachment store. Optional: the library and CLI work without it.
api = ["dep:axum"]
# SQL-backed attachment store (RFC-0009 phase D, Postgres). Optional accelerator
# for multi-node operation; the native in-memory/JSON store remains the default.
sql-store = ["dep:sqlx"]

[dependencies]
ag-core = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Control plane (RFC-0009): hostname IDN normalization and attachment ids/tokens.
idna = { workspace = true }
uuid = { workspace = true }

# Cloudflare adapter
reqwest = { workspace = true, optional = true }

# REST API (feature "api")
axum = { workspace = true, optional = true }

# SQL store (feature "sql-store")
sqlx = { workspace = true, optional = true }

# Propagacion DNS (hickory-resolver)
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"], optional = true }

# ACME / Let's Encrypt + certificate parsing
instant-acme = { version = "0.7", optional = true }
rcgen = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "net"] }
wiremock = { workspace = true }
reqwest = { workspace = true }
