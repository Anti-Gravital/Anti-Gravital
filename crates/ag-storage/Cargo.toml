[package]
name = "ag-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Store nativo Anti-Gravital: filesystem, servidor HTTP, S3/MinIO, procesamiento de imagen"
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
auth = ["dep:ag-auth"]
s3   = ["dep:object_store"]
# Lossy WebP encoding with configurable quality via the native `webp` crate
# (bundled libwebp). Default stays lossless via `image` (no native build).
webp-lossy = ["dep:webp"]

[dependencies]
ag-auth       = { path = "../ag-auth", version = "0.0.0", optional = true }
axum          = { workspace = true }
blake3        = { workspace = true }
bytes         = { workspace = true }
cap-fs-ext    = { workspace = true }
cap-std       = { workspace = true }
getrandom     = { workspace = true }
governor      = { workspace = true }
http          = { workspace = true }
image         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["fs"] }
tower         = { workspace = true }
tower-http    = { workspace = true }
tracing       = { workspace = true }
object_store  = { version = "0.11", features = ["aws"], optional = true }
# Lossy WebP encoder (feature "webp-lossy"). Bundles libwebp; built from source
# via cc, no system library required. from_rgba is used so it does not couple to
# the workspace `image` version.
webp          = { version = "0.3", optional = true, default-features = false }
hmac          = { workspace = true }
sha2          = { workspace = true }
base64ct      = { workspace = true }
futures-util  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
# Generate Ed25519 PKCS#8 PEM keypairs for the JWT auth-feature tests.
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
