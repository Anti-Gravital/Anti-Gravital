[package]
name = "ag-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Store nativo Anti-Gravital: filesystem, servidor HTTP, S3/MinIO, procesamiento de imagen"
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
auth = ["dep:ag-auth"]
lossy-webp = ["dep:webp"]
s3   = ["dep:object_store"]

[dependencies]
ag-auth       = { path = "../ag-auth", version = "0.0.0", optional = true }
axum          = { workspace = true }
blake3        = { workspace = true }
bytes         = { workspace = true }
cap-fs-ext    = { workspace = true }
cap-std       = { workspace = true }
getrandom     = { workspace = true }
governor      = { workspace = true }
http          = { workspace = true }
image         = { workspace = true }
webp          = { version = "0.3.1", optional = true, default-features = false }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["fs"] }
tower         = { workspace = true }
tower-http    = { workspace = true }
tracing       = { workspace = true }
object_store  = { version = "0.11", features = ["aws"], optional = true }
hmac          = { workspace = true }
sha2          = { workspace = true }
base64ct      = { workspace = true }
futures-util  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
