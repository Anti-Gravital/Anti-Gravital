# cargo-deny configuracion para Anti-Gravital.
# Politica de licencias, advisories, dependencias duplicadas y fuentes.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack en rsa 0.9.x (transitivo de jsonwebtoken).
    # Anti-Gravital usa exclusivamente EdDSA; ningun codigo invoca RSA.
    { id = "RUSTSEC-2023-0071" },
    # RUSTSEC-2026-0119: CPU exhaustion en hickory-proto BinEncoder (O(n^2)).
    # ag-domains usa hickory-resolver solo como cliente de consulta DNS saliente.
    # No codificamos mensajes con datos hostiles; el riesgo DoS no aplica.
    { id = "RUSTSEC-2026-0119" },
]

[licenses]
confidence-threshold = 0.93
# Licencias compatibles con Apache-2.0 y OSI-aprobadas.
# CDLA-Permissive-2.0: licencia de la Linux Foundation para datos;
#   usada por webpki-roots (certificados CA de Mozilla). Es permisiva
#   y compatible con Apache-2.0. Se incluye expresamente.
# Unicode-3.0 / Unicode-DFS-2016: cadena transitiva url -> idna -> icu_*.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # 0BSD: BSD Zero Clause License — equivalente a dominio publico.
    # Usada por hickory-resolver (transitivo de ag-domains propagation).
    "0BSD",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
