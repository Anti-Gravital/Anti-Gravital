# cargo-deny configuracion para Anti-Gravital.
# Politica de licencias, advisories, dependencias duplicadas y fuentes.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack en rsa 0.9.x (transitivo de jsonwebtoken).
    # Anti-Gravital usa exclusivamente EdDSA; ningun codigo invoca RSA.
    { id = "RUSTSEC-2023-0071" },
    # RUSTSEC-2024-0436: paste crate is unmaintained (transitivo via
    # image/ravif/rav1e). rav1e upstream uses paste for macro concat; no
    # alternative exists. Se ignora porque es una dependencia build-only y
    # no afecta la seguridad del binario final.
    { id = "RUSTSEC-2024-0436" },
    # RUSTSEC-2026-0543: chrono is unmaintained. The workspace no longer uses
    # it directly (RFC-0026 migration to `time` is complete), but object_store
    # 0.14.2 has a non-optional chrono dependency and is pulled in by the
    # opt-in `ag-storage/s3` feature. Removal condition: object_store drops
    # chrono, or the S3 adapter is replaced; tracked in issue #185.
    { id = "RUSTSEC-2026-0543" },
    # RUSTSEC-2026-0440: astral-tokio-tar is unmaintained. Reachable only from
    # testcontainers -> testcontainers-modules, dev-dependencies of ag-auth and
    # ag-cache used by local integration tests; not compiled into shipped binaries.
    # Removal condition: a testcontainers upgrade that drops it (issue #174).
    { id = "RUSTSEC-2026-0440" },
    # RUSTSEC-2026-0542: humantime is unmaintained. Under --all-features it is
    # reachable from console-subscriber (ag-observe) and object_store
    # (ag-storage/s3). It is a formatting helper, not a security boundary.
    # Removal condition: those adapters drop humantime or it becomes maintained.
    { id = "RUSTSEC-2026-0542" },
]

[licenses]
confidence-threshold = 0.93
# Licencias compatibles con Apache-2.0 y OSI-aprobadas.
# CDLA-Permissive-2.0: licencia de la Linux Foundation para datos;
#   usada por webpki-roots (certificados CA de Mozilla). Es permisiva
#   y compatible con Apache-2.0. Se incluye expresamente.
# Unicode-3.0 / Unicode-DFS-2016: cadena transitiva url -> idna -> icu_*.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # 0BSD: BSD Zero Clause License — equivalente a dominio publico.
    # Usada por hickory-resolver (transitivo de ag-domains propagation).
    "0BSD",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # NCSA: permissive OSI/FSF license used by libfuzzer-sys (rav1e dev path).
    "NCSA",
    # BSL-1.0: Boost Software License 1.0, used by xxhash-rust via redis.
    "BSL-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
