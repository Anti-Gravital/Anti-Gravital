# Generic Ingress. No ingressClassName and no TLS are set: the cluster admin
# chooses the controller and certificate mechanism. backend.service.name is
# `template`, the unprefixed Service name produced by every family overlay.
# Replace template.example.invalid with a real host before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: template
spec:
  rules:
    - host: template.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: template
                port:
                  name: http
