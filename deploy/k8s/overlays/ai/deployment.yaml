apiVersion: apps/v1
kind: Deployment
metadata:
  name: template
  labels:
    app.kubernetes.io/name: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
