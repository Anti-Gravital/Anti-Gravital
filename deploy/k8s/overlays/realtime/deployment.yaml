apiVersion: apps/v1
kind: Deployment
metadata:
  name: template
  labels:
    app.kubernetes.io/name: realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
