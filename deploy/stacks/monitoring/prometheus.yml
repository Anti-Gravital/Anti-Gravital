global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Default target for a generated project running on the host.
  # Change the port to match PROMETHEUS_PORT in the generated project, or
  # replace host.docker.internal with another compose service name.
  - job_name: ag-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
