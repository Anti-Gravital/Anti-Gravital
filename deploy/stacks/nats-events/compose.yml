# Local NATS with JetStream enabled for ag-realtime / ag-workers event flows.
# Monitoring port 8222 is bound to localhost only; it is unauthenticated.
# See README.md for ports and connection settings.
services:
  nats:
    image: nats:2.15.3-alpine
    restart: unless-stopped
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_HTTP_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  natsdata:
