# Local PostgreSQL plus an optional generated API service.
# The api service is behind the "app" profile so `docker compose up -d`
# starts only the database until a generated project is available.
# See README.md for ports and connection settings.
services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ag-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-ag}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ag} -d ${POSTGRES_DB:-ag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: ["app"]
    build:
      context: ${API_BUILD_CONTEXT:-.}
      dockerfile: ${API_DOCKERFILE:-Dockerfile}
    image: ${API_IMAGE:-ag-api:local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ag}:${POSTGRES_PASSWORD:-ag-local-only}@postgres:5432/${POSTGRES_DB:-ag}
      BIND: 0.0.0.0:${API_PORT:-8080}
      PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    # No in-container healthcheck: generated images may be scratch-based with
    # no shell or curl. Health is checked from the host; see README.md.

volumes:
  pgdata:
