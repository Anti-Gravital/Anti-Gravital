# Local Redis for the ag-cache external backend.
# No password by default: this stack is for localhost development only.
# See README.md for ports and connection settings.
services:
  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redisdata:
