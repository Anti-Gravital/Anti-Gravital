[package]
name = "auth-mail-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Demo: flujo de autenticacion con envio de correo usando ag-auth + ag-mail"

[[bin]]
name = "auth-mail-demo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ag-auth = { path = "../../crates/ag-auth", version = "0.0.0", features = ["mail"] }
ag-mail = { path = "../../crates/ag-mail", version = "0.0.0", features = ["smtp", "test-utils"] }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
