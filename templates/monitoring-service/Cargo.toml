[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "{{name}}"
path = "src/main.rs"

[features]
default = []
# Enables the real ag-observe integration. Its transitive OpenTelemetry crates
# are not part of the offline cache, so this opt-in needs network access.
ag-observe = ["dep:ag-observe"]

[dependencies]
ag-observe = { git = "https://github.com/anti-gravital/anti-gravital", rev = "91a95ff61ed6ef4c9d3f1c9069357e97389d1382", optional = true }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
