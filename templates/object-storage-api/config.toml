# Configuration for {{name}}.

[server]
bind = "127.0.0.1:8080"

[storage]
# The native filesystem backend needs no external service. For production,
# enable ag-storage's `s3` feature and set S3_BUCKET plus the credentials.
backend = "native"
root = "./ag-store-data"

[signing]
# HMAC secret used for signed URLs. Never commit a real secret. When unset,
# signed URL generation is disabled and /sign returns 503.
secret_env = "STORAGE_SIGN_SECRET"
default_ttl_secs = 300
