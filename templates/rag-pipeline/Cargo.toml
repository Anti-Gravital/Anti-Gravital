[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "{{name}}"
path = "src/main.rs"

[dependencies]
# Pinned for reproducible `ag new` projects (rules 31 and 36).
ag-core = { git = "https://github.com/anti-gravital/anti-gravital", rev = "91a95ff61ed6ef4c9d3f1c9069357e97389d1382" }
# ag-ai is the reserved home for AI capabilities. At the pinned revision it is
# a Phase 0 skeleton without a public API, so the answer generator here is a
# local, provider-agnostic implementation behind the AnswerGenerator trait.
ag-ai = { git = "https://github.com/anti-gravital/anti-gravital", rev = "91a95ff61ed6ef4c9d3f1c9069357e97389d1382" }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "matched-path"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
