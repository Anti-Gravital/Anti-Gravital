[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "{{name}}"
path = "src/main.rs"

[dependencies]
# Pinned for reproducible `ag new` projects (rules 31 and 36).
# ag-wasm-host is the reserved WASI runtime boundary. At the pinned revision it
# is a Phase 0 skeleton with no public API, so this scaffold implements the
# host-side lifecycle (discovery, validation, registration, capability policy,
# load/unload) locally. Module execution moves behind ag-wasm-host when its API
# is available.
ag-wasm-host = { git = "https://github.com/anti-gravital/anti-gravital", rev = "91a95ff61ed6ef4c9d3f1c9069357e97389d1382" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
